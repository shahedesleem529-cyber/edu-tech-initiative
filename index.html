-- =====================================================
-- Educational & Technology Integration Initiative
-- Run this whole file once in Supabase > SQL Editor
-- =====================================================
create extension if not exists pgcrypto;

do $$ begin
  create type reg_status as enum ('new','reviewing','accepted','waitlisted','rejected');
exception when duplicate_object then null; end $$;

-- Admins: only users listed here can read/update/delete registrations
create table if not exists public.admins (user_id uuid primary key references auth.users(id) on delete cascade);
alter table public.admins enable row level security;
drop policy if exists "admin reads own row" on public.admins;
create policy "admin reads own row" on public.admins for select to authenticated using (user_id = auth.uid());

create or replace function public.is_admin() returns boolean
language sql security definer stable set search_path = public as
$$ select exists (select 1 from public.admins where user_id = auth.uid()) $$;

-- Anti-abuse: reject oversized payloads
create or replace function public.limit_payload() returns trigger language plpgsql as $$
begin
  if length(to_jsonb(new)::text) > 20000 then raise exception 'payload too large'; end if;
  new.email := lower(trim(new.email));
  return new;
end $$;

create table if not exists public.technical_registrations (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz not null default now(),
  status reg_status not null default 'new',
  notes text,
  consent boolean not null check (consent),
  full_name text not null check (char_length(full_name) between 3 and 120),
  phone text not null check (phone ~ '^\+?[0-9 ()\-]{7,20}$'),
  email text not null check (email ~* '^[^\s@]+@[^\s@]+\.[^\s@]{2,}$' and char_length(email) <= 160),
  university text not null, major text not null,
  study_year text, is_club_member text,
  skills text[], tools text, experience_level text,
  has_projects text, projects_examples text,
  preferred_roles text[], willing_to_help text,
  weekly_time text, participation_mode text, extra_notes text
);

create table if not exists public.educational_registrations (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz not null default now(),
  status reg_status not null default 'new',
  notes text,
  consent boolean not null check (consent),
  full_name text not null check (char_length(full_name) between 3 and 120),
  phone text not null check (phone ~ '^\+?[0-9 ()\-]{7,20}$'),
  email text not null check (email ~* '^[^\s@]+@[^\s@]+\.[^\s@]{2,}$' and char_length(email) <= 160),
  university text not null, edu_major text not null,
  academic_status text, study_year text, graduation_year text,
  specialization_field text, subject_interest text,
  used_digital_tools text, tools_used text[], digital_level text,
  skills_wanted text[], idea text, team_willingness text,
  participation_mode text, available_time text, extra_notes text
);

create table if not exists public.teacher_registrations (
  id uuid primary key default gen_random_uuid(),
  created_at timestamptz not null default now(),
  status reg_status not null default 'new',
  notes text,
  consent boolean not null check (consent),
  full_name text not null check (char_length(full_name) between 3 and 120),
  phone text not null check (phone ~ '^\+?[0-9 ()\-]{7,20}$'),
  email text not null check (email ~* '^[^\s@]+@[^\s@]+\.[^\s@]{2,}$' and char_length(email) <= 160),
  subject text not null, stage text, years_experience text,
  workplace text, region text,
  designed_digital text, tools_used text[], produced_app text,
  skills_wanted text[], needs text, idea text,
  wants_self_learning text, training_willingness text,
  participation_mode text, preferred_time text, extra_notes text
);

do $$
declare t text;
begin
  foreach t in array array['technical_registrations','educational_registrations','teacher_registrations'] loop
    execute format('create unique index if not exists %I on public.%I (lower(email))', t||'_email_uq', t);
    execute format('create index if not exists %I on public.%I (phone)', t||'_phone_ix', t);
    execute format('create index if not exists %I on public.%I (created_at desc)', t||'_created_ix', t);
    execute format('drop trigger if exists %I on public.%I', t||'_limit', t);
    execute format('create trigger %I before insert or update on public.%I for each row execute function public.limit_payload()', t||'_limit', t);
    execute format('alter table public.%I enable row level security', t);
    execute format('revoke all on public.%I from anon, authenticated', t);
    execute format('grant insert on public.%I to anon, authenticated', t);
    execute format('grant select, update, delete on public.%I to authenticated', t);
    execute format('drop policy if exists "public can submit" on public.%I', t);
    execute format('create policy "public can submit" on public.%I for insert to anon, authenticated with check (status = ''new'' and notes is null)', t);
    execute format('drop policy if exists "admin read" on public.%I', t);
    execute format('create policy "admin read" on public.%I for select to authenticated using (public.is_admin())', t);
    execute format('drop policy if exists "admin update" on public.%I', t);
    execute format('create policy "admin update" on public.%I for update to authenticated using (public.is_admin()) with check (public.is_admin())', t);
    execute format('drop policy if exists "admin delete" on public.%I', t);
    execute format('create policy "admin delete" on public.%I for delete to authenticated using (public.is_admin())', t);
  end loop;
end $$;

</script>

    <select class="in" id="fo"><option value="desc" ${R.sort === "desc" ? "selected" : ""}>${L("الأحدث أولًا", "Newest first")}</option><option value="asc" ${R.sort === "asc" ? "selected" : ""}>${L("الأقدم أولًا", "Oldest first")}</option></select></div>
   <div id="tbl"></div>`);
  drawTable();
}
function drawTable() {
  const F = FORMS[R.tab], q = R.q.trim().toLowerCase();
  let rows = DATA[R.tab].filter(r => (!q || [r.full_name, r.email, r.phone].some(v => String(v || "").toLowerCase().includes(q))) && (!R.status || r.status === R.status) && (!R.spec || r[F.spec] === R.spec) && (!R.skill || (r[F.skillKey] || []).includes(R.skill)));
  rows.sort((a, b) => (R.sort === "asc" ? 1 : -1) * (new Date(a.created_at) - new Date(b.created_at)));
  const pages = Math.max(1, Math.ceil(rows.length / PER)); R.page = Math.min(R.page, pages);
  const cur = rows.slice((R.page - 1) * PER, R.page * PER);
  $("#tbl").innerHTML = `<div class="tw"><table><thead><tr><th>${L("الاسم", "Name")}</th><th>${L("الجوال", "Phone")}</th><th>${L("البريد", "Email")}</th><th>${L("التخصص", "Major")}</th><th>${L("التاريخ", "Date")}</th><th>${L("الحالة", "Status")}</th><th></th></tr></thead><tbody>
   ${cur.length ? cur.map(r => `<tr><td class="n">${esc(r.full_name)}</td><td class="ltr">${esc(r.phone)}</td><td class="ltr">${esc(r.email)}</td><td>${esc(r[F.spec])}</td><td>${fmtD(r.created_at)}</td><td><span class="badge st-${r.status}">${stL(r.status)}</span></td><td><a class="btn sm ghost" href="#/admin/reg/${R.tab}/${r.id}">${ic("eye")}${L("عرض", "View")}</a></td></tr>`).join("") : `<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">${L("لا توجد تسجيلات مطابقة", "No matching registrations")}</td></tr>`}</tbody></table></div>
   <div class="pager"><button class="btn sm ghost" data-pg="-1" ${R.page <= 1 ? "disabled" : ""}>${L("السابق", "Prev")}</button><span>${L("صفحة", "Page")} ${R.page} / ${pages} — ${rows.length}</span><button class="btn sm ghost" data-pg="1" ${R.page >= pages ? "disabled" : ""}>${L("التالي", "Next")}</button></div>`;
}
async function pRegs() {
  await loadAll(); renderRegs();
  const m = $("#main");
  m.onclick = e => {
    const t = e.target.closest("[data-tab]"); if (t) { Object.assign(R, { tab: t.dataset.tab, q: "", status: "", spec: "", skill: "", page: 1 }); renderRegs(); return; }
    const p = e.target.closest("[data-pg]"); if (p) { R.page += +p.dataset.pg; drawTable(); }
  };
  m.oninput = m.onchange = e => {
    const map = { fq: "q", fs: "status", fp: "spec", fk: "skill", fo: "sort" };
    if (map[e.target.id]) { R[map[e.target.id]] = e.target.value; R.page = 1; drawTable(); }
  };
}
async function pDetail(k, id) {
  const F = FORMS[k]; if (!F) { setMain(p404()); return; }
  const { data: r, error } = await sb.from(F.table).select("*").eq("id", id).maybeSingle();
  if (error) throw error;
  if (!r) { setMain(`<div class="alert e">${L("التسجيل غير موجود.", "Registration not found.")}</div><a class="btn" href="#/admin/regs">${L("رجوع", "Back")}</a>`); return; }
  const show = x => {
    if (["text", "tel", "email", "ta"].includes(x.t)) return x.t === "ta" ? `<textarea class="in ed" data-n="${x.n}" rows="3" readonly>${esc(r[x.n])}</textarea>` : `<input class="in ed" data-n="${x.n}" value="${esc(r[x.n])}" readonly ${x.t !== "text" ? 'dir="ltr"' : ""}>`;
    const v = Array.isArray(r[x.n]) ? r[x.n].join("، ") : r[x.n]; return `<div class="val">${esc(v) || "—"}</div>`;
  };
  setMain(`<a href="#/admin/regs" onclick="R.tab='${k}'">${L("← رجوع إلى التسجيلات", "← Back to registrations")}</a>
   <div class="card" style="margin-top:12px"><h1 class="h2">${esc(r.full_name)}</h1><p class="lead">${catL(k)} — ${L("رقم التسجيل", "ID")}: <span class="code" style="font-size:.9rem">${esc(r.id.slice(0, 8).toUpperCase())}</span> — ${fmtD(r.created_at)}</p>
   <div class="kv" style="margin-top:14px">${F.fields.map(x => `<div class="fld"><label class="lbl">${esc(x.l)}</label>${show(x)}</div>`).join("")}</div></div>
   <div class="card" style="margin-top:16px"><h3>${L("إدارة التسجيل", "Manage")}</h3><div class="kv">
    <div class="fld"><label class="lbl">${L("حالة التسجيل", "Status")}</label><select class="in" id="ds">${Object.keys(STATUS).map(s => `<option value="${s}" ${r.status === s ? "selected" : ""}>${stL(s)}</option>`).join("")}</select></div>
    <div class="fld"><label class="lbl">${L("ملاحظات إدارية", "Admin notes")}</label><textarea class="in" id="dn" rows="3" maxlength="2000">${esc(r.notes)}</textarea></div></div>
    <div class="row"><button class="btn" id="sv">${L("حفظ التغييرات", "Save changes")}</button><button class="btn alt" id="ed">${ic("pen")}${L("تعديل البيانات", "Edit data")}</button><button class="btn bad" id="dl">${ic("trash")}${L("حذف التسجيل", "Delete")}</button></div><div id="dm"></div></div>`);
  $("#ed").onclick = () => { const on = $(".ed").readOnly; $$(".ed").forEach(e => e.readOnly = !on); $("#ed").lastChild.textContent = on ? L("إنهاء التعديل", "Stop editing") : L("تعديل البيانات", "Edit data"); };
  $("#sv").onclick = async () => {
    const upd = { status: $("#ds").value, notes: $("#dn").value.trim() || null };
    for (const el of $$(".ed")) { const x = F.fields.find(y => y.n === el.dataset.n), v = el.value.trim(), m = chk({ ...x, r: x.show ? 0 : x.r }, v); if (m) { toast(`${x.l}: ${m}`, "e"); return; } upd[x.n] = v || null; }
    $("#sv").disabled = true;
    const { data, error } = await sb.from(F.table).update(upd).eq("id", id).select("id");
    $("#sv").disabled = false;
    if (error || !data?.length) { toast(L("تعذّر الحفظ. تحقق من صلاحيات الإدارة.", "Could not save. Check admin permissions."), "e"); return; }
    DATA = null; toast(L("تم حفظ التغييرات", "Changes saved"));
  };
  $("#dl").onclick = async () => {
    if (!confirm(L("هل أنت متأكد من حذف هذا التسجيل نهائيًا؟ لا يمكن التراجع.", "Delete this registration permanently? This cannot be undone."))) return;
    const { data, error } = await sb.from(F.table).delete().eq("id", id).select("id");
    if (error || !data?.length) { toast(L("تعذّر الحذف.", "Could not delete."), "e"); return; }
    DATA = null; nav("/admin/regs");
  };
}
async function pSettings() {
  const { data: { session } } = await sb.auth.getSession();
  setMain(`<h1 class="h2">${L("الإعدادات", "Settings")}</h1>
   <div class="card"><h3>${L("الاتصال بقاعدة البيانات", "Database connection")}</h3><p>${L("الحساب الحالي", "Signed in as")}: <b class="ltr">${esc(session?.user?.email)}</b></p>
    <button class="btn sm" id="tc">${L("اختبار الاتصال", "Test connection")}</button> <span id="tr"></span></div>
   <div class="card" style="margin-top:16px"><h3>${L("ملف SQL لإنشاء الجداول والحماية (RLS)", "SQL for tables and RLS")}</h3>
    <button class="btn sm ghost" data-act="copysql">${L("نسخ SQL", "Copy SQL")}</button><pre class="sql" id="sqlbox"></pre></div>
   <div class="card" style="margin-top:16px"><h3>${L("إضافة مسؤول جديد", "Adding an admin")}</h3><p>${L("أنشئ المستخدم من Authentication > Users في Supabase، ثم نفّذ في SQL Editor:", "Create the user in Supabase Authentication > Users, then run in the SQL Editor:")}</p><pre class="sql">insert into public.admins (user_id) select id from auth.users where email = 'ADMIN_EMAIL';</pre></div>`);
  $("#sqlbox").textContent = $("#sql").textContent.trim();
  $("#tc").onclick = async () => {
    const { error } = await sb.from("technical_registrations").select("id", { count: "exact", head: true });
    $("#tr").innerHTML = error ? `<span class="badge st-rejected">${L("فشل: ", "Failed: ")}${esc(error.message)}</span>` : `<span class="badge st-accepted">${L("الاتصال يعمل", "Connection OK")}</span>`;
  };
}
async function adminRoute(p, qs) {
  const app = $("#app");
  if (!sb) { app.innerHTML = noDb(); return; }
  if (p[0] === "login") { pLogin(qs); return; }
  const g = await requireAdmin();
  if (g === "login") { nav("/admin/login"); return; }
  if (g === "denied") { nav("/admin/login?denied=1"); return; }
  const sec = p[0] === "regs" || p[0] === "reg" ? "regs" : p[0] === "settings" ? "set" : "dash";
  app.innerHTML = ash(sec, loading());
  try {
    if (sec === "dash") await pDash();
    else if (p[0] === "regs") await pRegs();
    else if (p[0] === "reg") await pDetail(p[1], p[2]);
    else await pSettings();
  } catch (e) { setMain(errBox(e)); }
}
async function exportXlsx(which) {
  if (!window.XLSX) { toast(L("مكتبة Excel لم تُحمَّل. تحقق من الاتصال بالإنترنت.", "Excel library failed to load."), "e"); return; }
  try {
    toast(L("جارٍ جلب البيانات من Supabase…", "Fetching data from Supabase…"), "w");
    const wb = XLSX.utils.book_new();
    for (const k of which === "all" ? KEYS : [which]) {
      const F = FORMS[k], rows = await fetchAll(F.table);
      const head = ["رقم التسجيل", "تاريخ التسجيل", "حالة التسجيل", ...F.fields.map(x => x.l), "ملاحظات الإدارة"];
      const body = rows.map(r => [r.id, new Date(r.created_at).toLocaleString("en-GB"), STATUS[r.status]?.[0] || r.status, ...F.fields.map(x => Array.isArray(r[x.n]) ? r[x.n].join("، ") : (r[x.n] ?? "")), r.notes || ""]);
      const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
      ws["!cols"] = head.map((h, i) => ({ wch: Math.min(50, Math.max(String(h).length, ...body.slice(0, 200).map(r => String(r[i]).length)) + 2) }));
      ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(body.length, 1), c: head.length - 1 } }) };
      XLSX.utils.book_append_sheet(wb, ws, F.sheet);
    }
    wb.Workbook = { Views: [{ RTL: true }] };
    const d = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, which === "all" ? `Initiative_Registrations_${d}.xlsx` : `${FORMS[which].sheet.replace(/ /g, "_")}_Registrations_${d}.xlsx`);
    toast(L("تم إنشاء ملف Excel", "Excel file created"));
  } catch (e) { toast(L("تعذّر التصدير: ", "Export failed: ") + (e.message || e), "e"); }
}

/* ============ 7) التوجيه والأحداث ============ */
let pendingGo = null, curPath = null;
const getPath = () => { try { return location.hash.replace(/^#/, "") || "/"; } catch (e) { return "/"; } };
function nav(p) {
  if (curPath === p) { window.scrollTo(0, 0); return; }
  curPath = p;
  try { if (location.hash !== "#" + p) location.hash = "#" + p; } catch (e) {}
  route();
}
function goSection(id) {
  $("#nav")?.classList.remove("open");
  if ((curPath ?? getPath()) !== "/") { pendingGo = id; nav("/"); return; }
  if (id === "home") window.scrollTo(0, 0); else document.getElementById(id)?.scrollIntoView();
}
async function route() {
  if (curPath === null) curPath = getPath();
  const [path, qs] = curPath.replace(/^\//, "").split("?"), p = path.split("/").filter(Boolean), app = $("#app");
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  try {
    if (p[0] === "admin") { await adminRoute(p.slice(1), qs); window.scrollTo(0, 0); return; }
    if (!p.length) {
      app.innerHTML = pHome();
      const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 }) : null;
      $$(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
      if (pendingGo) { const id = pendingGo; pendingGo = null; setTimeout(() => (id === "home" ? window.scrollTo(0, 0) : document.getElementById(id)?.scrollIntoView()), 30); } else window.scrollTo(0, 0);
    } else if (p[0] === "register") { app.innerHTML = pReg(p[1]); if (FORMS[p[1]]) bindReg(p[1]); window.scrollTo(0, 0); }
    else if (p[0] === "success") { app.innerHTML = pSuccess(); window.scrollTo(0, 0); }
    else app.innerHTML = p404();
  } catch (e) { console.error(e); app.innerHTML = shell(`<div class="wrap center"><div class="alert e" style="max-width:520px;margin:auto">${L("حدث خطأ غير متوقع. حاول تحديث الصفحة.", "Unexpected error. Please refresh the page.")}</div></div>`); }
}
document.addEventListener("click", async e => {
  const l = e.target.closest('a[href^="#/"]');
  if (l) { e.preventDefault(); $("#nav")?.classList.remove("open"); nav(l.getAttribute("href").slice(1)); return; }
  const g = e.target.closest("[data-go]"); if (g) { goSection(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "lang") { lang = lang === "ar" ? "en" : "ar"; try { localStorage.setItem("lang", lang); } catch (x) {} route(); }
  else if (act === "burger") $("#nav").classList.toggle("open");
  else if (act === "logout") { await sb.auth.signOut(); DATA = null; nav("/admin/login"); }
  else if (act === "export") { a.closest("details")?.removeAttribute("open"); exportXlsx(a.dataset.k); }
  else if (act === "copysql") { try { await navigator.clipboard.writeText($("#sql").textContent.trim()); toast(L("تم نسخ SQL", "SQL copied")); } catch (x) { toast(L("تعذّر النسخ. حدد النص يدويًا.", "Copy failed. Select the text manually."), "e"); } }
});
window.addEventListener("hashchange", () => { const p = getPath(); if (p !== curPath) { curPath = p; route(); } });
route();
</script>
